---
- name: Extract distribution base name (works on linux mint as well)
  command: grep -oP 'UBUNTU_CODENAME=\K.*' /etc/os-release
  register: distro
  changed_when: False
  when: ansible_distribution != 'Debian'
- name: Select KeePass installation directory
  set_fact:
    keepass_install_dir: "{{ '/opt/keepass2-portable' if ansible_distribution == 'Debian' else '/usr/lib/keepass2' }}"
- name: Update apt cache.
  apt:
    update_cache: yes
    cache_valid_time: 3600
- name: Install some required base packages
  apt:
    pkg:
      - ca-certificates
      - gpg
      - python3-debian
      - unzip
- name: Remove legacy apt repo for Keepass 2
  ansible.builtin.apt_repository:
    repo: "{{ item }} [signed-by=/etc/apt/keyrings/ubuntuhandbook1-keepass2.gpg] http://ppa.launchpad.net/ubuntuhandbook1/keepass2/ubuntu {{ distro.stdout }} main"
    state: absent
    update_cache: false
  with_items:
    - deb
    - deb-src
  when: ansible_distribution != 'Debian'
- name: Add apt repo for Keepass 2
  ansible.builtin.deb822_repository:
    name: keepass2-ppa
    types:
      - deb
      - deb-src
    uris: https://ppa.launchpadcontent.net/ubuntuhandbook1/keepass2/ubuntu
    suites: "{{ distro.stdout }}"
    components: main
    signed_by: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF4E48910A020E77056748B745738AE8480447DDF
    state: present
  register: keepass2_repository
  when: ansible_distribution != 'Debian'
- name: Install keepass packages
  apt:
    update_cache: "{{ keepass2_repository.changed }}"
    pkg:
      - keepass2
      - xsel
      - xdotool
      # For (manual) gnome keyring integration
      - libsecret-tools
      # Following needed in order to set up plugin cache for keepass2-plugin-rpc
      - mono-complete
  when: ansible_distribution != 'Debian'
- name: Install KeePass dependencies on Debian
  apt:
    pkg:
      - xsel
      - xdotool
      - libsecret-tools
      - mono-complete
      - libgcrypt20
      - libargon2-1
  when: ansible_distribution == 'Debian'
- name: Download KeePass portable archive
  get_url:
    url: "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/{{ keepass_version }}/KeePass-{{ keepass_version }}.zip"
    checksum: "sha256:{{ keepass_sha256 }}"
    dest: "/tmp/KeePass-{{ keepass_version }}.zip"
    mode: '0644'
  when: ansible_distribution == 'Debian'
- name: Create KeePass portable directory
  file:
    path: "/opt/keepass2-portable-{{ keepass_version }}"
    state: directory
    mode: '0755'
  when: ansible_distribution == 'Debian'
- name: Extract KeePass portable archive
  unarchive:
    src: "/tmp/KeePass-{{ keepass_version }}.zip"
    dest: "/opt/keepass2-portable-{{ keepass_version }}"
    remote_src: yes
  when: ansible_distribution == 'Debian'
- name: Symlink current KeePass portable directory
  file:
    src: "keepass2-portable-{{ keepass_version }}"
    dest: /opt/keepass2-portable
    state: link
  when: ansible_distribution == 'Debian'
- name: Install KeePass portable launcher
  copy:
    dest: /usr/local/bin/keepass2-portable
    mode: '0755'
    content: |
      #!/bin/sh
      exec /usr/bin/mono /opt/keepass2-portable/KeePass.exe "$@"
  when: ansible_distribution == 'Debian'
- name: Create desktop applications directory
  file:
    path: /usr/local/share/applications
    state: directory
    mode: '0755'
  when: ansible_distribution == 'Debian'
- name: Install KeePass portable desktop entry
  copy:
    dest: /usr/local/share/applications/keepass2-portable.desktop
    mode: '0644'
    content: |
      [Desktop Entry]
      Name=KeePass 2 (Portable)
      Comment=Password manager
      Exec=/usr/local/bin/keepass2-portable %f
      Terminal=false
      Type=Application
      Categories=Utility;Security;
  when: ansible_distribution == 'Debian'
- name: Create keepass Plugins directory
  file:
    path: "{{ keepass_install_dir }}/Plugins"
    state: directory
    mode: 0755
- name: Check if KeePassRPC-{{ keepassrpc_version }} (Firefox integration requirement) already installed
  stat:
    path: "{{ keepass_install_dir }}/Plugins/KeePassRPC.plgx-{{ keepassrpc_version }}"
  register: keepassrpc_bin
- name: Download KeePassRPC {{ keepassrpc_version }}
  get_url:
    url: https://github.com/kee-org/keepassrpc/releases/download/v{{ keepassrpc_version }}/KeePassRPC.plgx
    checksum: "sha256:{{ keepassrpc_sha256 }}"
    dest: "{{ keepass_install_dir }}/Plugins/KeePassRPC.plgx-{{ keepassrpc_version }}"
    mode: 0644
  when: not keepassrpc_bin.stat.exists
- name: Symlink default KeePassRPC
  file:
    src: KeePassRPC.plgx-{{ keepassrpc_version }}
    dest: "{{ keepass_install_dir }}/Plugins/KeePassRPC.plgx"
    state: link
- name: Check if KeeTrayTOTP-{{ keetraytotp_version }} already installed
  stat:
    path: "{{ keepass_install_dir }}/Plugins/KeeTrayTOTP.plgx-{{ keetraytotp_version }}"
  register: keetraytotp_bin
- name: Download KeeTrayTOTP {{ keetraytotp_version }}
  get_url:
    url: https://github.com/KeeTrayTOTP/KeeTrayTOTP/releases/download/v{{ keetraytotp_version }}/KeeTrayTOTP.plgx
    checksum: "sha256:{{ keetraytotp_sha256 }}"
    dest: "{{ keepass_install_dir }}/Plugins/KeeTrayTOTP.plgx-{{ keetraytotp_version }}"
    mode: 0644
  when: not keetraytotp_bin.stat.exists
- name: Symlink default KeeTrayTOTP
  file:
    src: KeeTrayTOTP.plgx-{{ keetraytotp_version }}
    dest: "{{ keepass_install_dir }}/Plugins/KeeTrayTOTP.plgx"
    state: link
- name: Check if Yet-Another-Favicon-Downloader -{{ yetanotherfavicondl_version }} already installed
  stat:
    path: "{{ keepass_install_dir }}/Plugins/YetAnotherFaviconDownloader.plgx-{{ yetanotherfavicondl_version }}"
  register: yetanotherfavicondl
- name: Download Yet-Another-Favicon-Downloader  {{ yetanotherfavicondl_version }}
  get_url:
    url: https://github.com/navossoc/KeePass-Yet-Another-Favicon-Downloader/releases/download/v{{ yetanotherfavicondl_version }}/YetAnotherFaviconDownloader.plgx
    checksum: "sha256:{{ yetanotherfavicondl_sha256 }}"
    dest: "{{ keepass_install_dir }}/Plugins/YetAnotherFaviconDownloader.plgx-{{ yetanotherfavicondl_version }}"
    mode: 0644
  when: not yetanotherfavicondl.stat.exists
- name: Symlink default Yet-Another-Favicon-Downloader 
  file:
    src: YetAnotherFaviconDownloader.plgx-{{ yetanotherfavicondl_version }}
    dest: "{{ keepass_install_dir }}/Plugins/YetAnotherFaviconDownloader.plgx"
    state: link
- name: Check if KPScript already installed
  stat:
    path: /opt/kpscript-{{ kpscript_version }}/KPScript.exe
  register: kpscript_bin
- name: Create KPScript directory
  file:
    path: "/opt/kpscript-{{ kpscript_version }}"
    state: directory
    mode: 0755
- name: Download KPScript
  get_url:
    url: http://keepass.info/extensions/v2/kpscript/KPScript-{{ kpscript_version }}.zip
    checksum: "sha256:{{ kpscript_sha256 }}"
    dest: /tmp/
    mode: 0644
  when: not kpscript_bin.stat.exists
- name: Unarchive KPScript
  unarchive:
    src: /tmp/KPScript-{{ kpscript_version }}.zip
    dest: /tmp
    remote_src: yes
  when: not kpscript_bin.stat.exists
- name: Install KPScript binary
  command: install -D -m644 /tmp/KPScript.exe "/opt/kpscript-{{ kpscript_version }}/KPScript.exe"
  changed_when: false
  when: not kpscript_bin.stat.exists
- name: Symlink default KPScript
  file:
    src: "kpscript-{{ kpscript_version }}"
    dest: "/opt/kpscript"
    state: link
- name: Symlink default KPScript.exe
  file:
    src: "/opt/kpscript/KPScript.exe"
    dest: "{{ keepass_install_dir }}/KPScript.exe"
    state: link
    force: yes
- name: Install kpscript helper script
  template:
    src: kpscript.j2
    dest: /usr/local/bin/kpscript
    mode: "755"
